<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Leemos: administración</title>
<style>
  :root{color-scheme:light dark;font-family:system-ui,sans-serif}
  body{margin:0 auto;max-width:720px;padding:16px}
  input,select,button{font:inherit;padding:10px 16px;min-height:44px;border-radius:12px;border:2px solid #8886;background:Canvas;color:CanvasText;cursor:pointer}
  input{cursor:text}
  button.primary{background:#6D4AF0;border-color:#6D4AF0;color:#fff;font-weight:700}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6D4AF0;outline-offset:2px}
  .muted{opacity:.75}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
  .warn{margin:12px 0;padding:12px;border-radius:12px;background:#f59e0b33;border:2px solid #f59e0b}
  article.class{margin:12px 0;padding:12px;border-radius:12px;border:2px solid #8883}
  li{margin:6px 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<h1>Administración</h1>
<main id="app"></main>
<script type="module" src="admin.js"></script>
</body>
</html>
