<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumi lab</title>
<link rel="stylesheet" href="../src/styles.css">
<style>
  body{padding:16px;max-width:980px;margin:0 auto}
  h1{font-size:1.2rem;margin:0 0 4px}
  p.note{margin:0 0 14px;opacity:.75;font-size:.9rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .card{border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .card h2{font-size:.95rem;margin:0}
  .card .mascot{width:150px;height:150px}
  .big-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:16px 0}
  .big-row .mascot{width:min(70vw,340px);height:min(70vw,340px);animation:none}
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0}
  .controls label{display:flex;gap:6px;align-items:center}
  button.t{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:inherit;font:inherit;cursor:pointer}
</style>
</head>
<body>
<h1>Lumi lab</h1>
<p class="note">Preview of the 2.5D owl. It uses the real <code>src/styles.css</code>. The markup in the template is what goes into <code>index.html</code>.</p>

<!-- the gradients are shared by every copy of him (also the big one): one hidden svg, never display:none (Safari drops gradients from those) -->
<svg class="lumi-defs" id="lumiDefs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="lumiBody" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#8F72FF"/><stop offset=".55" stop-color="#6D4AF0"/><stop offset="1" stop-color="#4326B4"/></radialGradient>
    <radialGradient id="lumiBelly" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCD0FF"/></radialGradient>
    <radialGradient id="lumiSclera" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6DEFF"/></radialGradient>
    <radialGradient id="lumiIris" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD76A"/><stop offset=".7" stop-color="#FFB224"/><stop offset="1" stop-color="#E58A00"/></radialGradient>
    <linearGradient id="lumiBeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC247"/><stop offset="1" stop-color="#FF9410"/></linearGradient>
    <linearGradient id="lumiWingL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A47E8"/><stop offset="1" stop-color="#3B1FA3"/></linearGradient>
    <linearGradient id="lumiWingR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A47E8"/><stop offset="1" stop-color="#3B1FA3"/></linearGradient>
  </defs>
</svg>

<template id="owl">
<svg class="mascot" viewBox="0 0 120 120" role="img" aria-label="Lumi, el búho">
  <ellipse class="shadow" cx="60" cy="115" rx="30" ry="3.6" fill="#1E1B3A" fill-opacity=".16"/>
  <g class="rig">
  <g class="wing wl">
    <path d="M32 48 C8 52 5 92 22 101 C31 90 36 66 32 48Z" fill="url(#lumiWingL)"/>
    <path d="M21 64 q4 12 2 25 M14 71 q4 10 2 20" fill="none" stroke="#2C1585" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g class="wing wr">
    <path d="M88 48 C112 52 115 92 98 101 C89 90 84 66 88 48Z" fill="url(#lumiWingR)"/>
    <path d="M99 64 q-4 12 -2 25 M106 71 q-4 10 -2 20" fill="none" stroke="#2C1585" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g class="body">
    <ellipse cx="60" cy="68" rx="38" ry="42" fill="url(#lumiBody)"/>
    <path d="M28 62 C26 44 40 32 58 30" fill="none" stroke="#C4B4FF" stroke-opacity=".38" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="60" cy="86" rx="25" ry="26" fill="url(#lumiBelly)"/>
    <path d="M46 78q4 5 8 0M54 78q4 5 8 0M62 78q4 5 8 0M42 88q4 5 8 0M50 88q4 5 8 0M58 88q4 5 8 0M66 88q4 5 8 0M46 98q4 5 8 0M54 98q4 5 8 0M62 98q4 5 8 0" fill="none" stroke="#CFC2FF" stroke-width="1.5" stroke-linecap="round"/>
    <path class="bstar" d="M60 84 l3 6 6.5 1 -4.7 4.5 1.2 6.5 -6 -3.2 -6 3.2 1.2 -6.5 -4.7 -4.5 6.5 -1z" fill="#FFC53D"/>
    <path d="M57 90 q3 -2 6 0" fill="none" stroke="#FFF1B8" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g class="head-lag"><g class="head">
    <g class="ear el"><path d="M30 36 L36 10 L56 28Z" fill="#6D4AF0"/><path d="M36 30 L38.5 17 L49 27Z" fill="#4326B4" fill-opacity=".55"/></g>
    <g class="ear er"><path d="M90 36 L84 10 L64 28Z" fill="#6D4AF0"/><path d="M84 30 L81.5 17 L71 27Z" fill="#4326B4" fill-opacity=".55"/></g>
    <g class="face">
      <ellipse cx="45" cy="53" rx="17.5" ry="16.5" fill="#B9A6FF" fill-opacity=".42"/>
      <ellipse cx="75" cy="53" rx="17.5" ry="16.5" fill="#B9A6FF" fill-opacity=".42"/>
      <path class="brow bl" d="M30 39 Q40 30 52 36 Q41 34.5 30 39Z" fill="#3B1FA3" fill-opacity=".85"/>
      <path class="brow br" d="M90 39 Q80 30 68 36 Q79 34.5 90 39Z" fill="#3B1FA3" fill-opacity=".85"/>
      <g class="eyes">
        <g class="eye-open">
          <circle cx="45" cy="53" r="13.5" fill="url(#lumiSclera)"/>
          <circle cx="75" cy="53" r="13.5" fill="url(#lumiSclera)"/>
          <g class="gaze"><g transform="translate(46 54)"><g class="pupil"><circle r="8.4" fill="url(#lumiIris)"/><g class="pdot"><circle r="4.6" fill="#1E1B3A"/></g><circle cx="2.6" cy="-2.8" r="2.4" fill="#fff"/><circle cx="-2.6" cy="3" r="1.1" fill="#fff" fill-opacity=".8"/></g></g></g>
          <g class="gaze"><g transform="translate(74 54)"><g class="pupil"><circle r="8.4" fill="url(#lumiIris)"/><g class="pdot"><circle r="4.6" fill="#1E1B3A"/></g><circle cx="2.6" cy="-2.8" r="2.4" fill="#fff"/><circle cx="-2.6" cy="3" r="1.1" fill="#fff" fill-opacity=".8"/></g></g></g>
          <path class="lid" d="M31.5 53 A13.5 13.5 0 0 1 58.5 53Z"/>
          <path class="lid" d="M61.5 53 A13.5 13.5 0 0 1 88.5 53Z"/>
        </g>
        <path class="eye-happy" d="M35.5 57 Q45 46 54.5 57" fill="none" stroke="#1E1B3A" stroke-width="3.6" stroke-linecap="round"/>
        <path class="eye-happy" d="M65.5 57 Q75 46 84.5 57" fill="none" stroke="#1E1B3A" stroke-width="3.6" stroke-linecap="round"/>
      </g>
      <g class="beak">
        <path class="mouth" d="M54.5 70 Q60 68.5 65.5 70 L64.2 77 Q60 79 55.8 77Z" fill="#5B1A00"/>
        <path class="jaw" d="M54.5 70 Q60 69 65.5 70 L60 77.5Z" fill="#E87500"/>
        <path d="M52 61 Q60 57.5 68 61 L60 74Z" fill="url(#lumiBeak)"/>
        <path d="M56 62.4 Q60 60.8 64 62.4" fill="none" stroke="#FFE3A3" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>
  </g></g>
  <path d="M45 109 h11 M64 109 h11" stroke="#FFA41B" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 112 v2.6 M54 112 v2.6 M66 112 v2.6 M72 112 v2.6" stroke="#E08A00" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
</template>

<div class="controls">
  <label>Boca <input id="jaw" type="range" min="0" max="1" step=".05" value="0"></label>
  <button class="t" id="talk" type="button">Hablar (boca automática)</button>
  <label><input id="auto" type="checkbox" checked> Vida propia (actos al azar)</label>
</div>
<div class="controls" id="acts"></div>
<p class="note">Mueve el ratón o toca la página: Lumi mira hacia donde apuntas. Toca a Lumi: se ríe.</p>

<div class="big-row" id="big"></div>
<div class="grid" id="grid"></div>

<script type="module">
import { ACTS, lumiLife, followPointer } from '../src/lumi.js';
const tpl = document.getElementById('owl');
const owl = (cls) => { const s = tpl.content.firstElementChild.cloneNode(true); if (cls) s.classList.add(...cls.split(' ')); return s; };
const MOODS = [['Neutro', ''], ['Contento (m-happy)', 'm-happy'], ['Hurra (cheer: salta y aletea)', 'cheer'], ['Pensando (m-think)', 'm-think'], ['Ups (tilt)', 'tilt'], ['Sorpresa (m-wow)', 'm-wow'], ['Sueño (m-sleepy)', 'm-sleepy'], ['Baila (dance)', 'dance']];
const all = [];
const big = owl(''); document.getElementById('big').appendChild(big); all.push(big);
const grid = document.getElementById('grid');
for (const [name, cls] of MOODS) {
  const c = document.createElement('div'); c.className = 'card'; c.innerHTML = '<h2></h2>'; c.firstChild.textContent = name;
  const s = owl(cls); c.appendChild(s); grid.appendChild(c); all.push(s);
}
const $ = (id) => document.getElementById(id);
const set = (k, v) => all.forEach((s) => s.style.setProperty(k, v));
$('jaw').oninput = () => set('--jaw', $('jaw').value);
let talking = false;
const life = lumiLife(big, { canAct: () => !talking && $('auto').checked });
life.start();
followPointer(document, big, life);
big.addEventListener('click', () => life.act('giggle'));
for (const name of Object.keys(ACTS)) { const b = document.createElement('button'); b.className = 't'; b.type = 'button'; b.textContent = name; b.onclick = () => life.act(name); $('acts').appendChild(b); }
let t = 0;
$('talk').onclick = () => { talking = !talking; $('talk').textContent = talking ? 'Parar' : 'Hablar (boca automática)'; big.classList.toggle('talking', talking); if (!talking) { clearTimeout(t); set('--jaw', 0); $('jaw').value = 0; } else loop(); };
function loop() { if (!talking) return; set('--jaw', String(Math.random() * .9 + .1)); t = setTimeout(() => { set('--jaw', '0'); t = setTimeout(loop, 90 + Math.random() * 60); }, 150 + Math.random() * 80); }
</script>
</body>
</html>
